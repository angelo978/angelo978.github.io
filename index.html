<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>La Storia del Pinguino di Natale - Avventura Natalizia</title>
<meta name="description" content="Segui l'avventura del pinguino brontolone che deve recuperare la soletta magica per salvare il Natale. Una storia divertente con 35 scene animate.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #0f0;
    font-family: monospace;
    overflow: hidden;
  }

  /* GRECHINA NATALIZIA */
  .grechina {
    text-align: center;
    font-size: 1.5vw;
    letter-spacing: 5px;
    padding: 5px 0;
    text-shadow: 0 0 10px #0f0;
    background: #000;
    width: 100%;
    z-index: 10;
  }

  #main-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }

  #container {
    display: flex;
    flex: 1;
    width: 100%;
    overflow: hidden;
  }

  /* SINISTRA */
  #left {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* MENU SINISTRA */
  #leftmenu {
    margin-bottom: 30px;
    text-align: center;
  }

  #leftmenu a {
    color: #0f0;
    text-decoration: none;
    margin: 0 10px;
    font-size: 2vw;
    text-shadow: 0 0 10px #0f0;
  }

  #clock {
    font-size: 4vw;
    text-shadow: 0 0 20px #0f0;
    margin-bottom: 20px;
  }

  #count1 {
    font-size: 2.5vw;
    text-shadow: 0 0 10px #0f0;
  }

  #count2 {
    font-size: 2vw;
    text-shadow: 0 0 10px #0f0;
    margin-top: 5px;
  }

  /* DESTRA */
  #right {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #right img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    border: 2px solid #0f0;
    box-shadow: 0 0 20px #0f0;
    transition: opacity 0.5s ease-in-out;
  }

  /* MAGIA PER SMARTPHONE IN VERTICALE: SCRITTE SOPRA, FOTO SOTTO */
  @media (max-width: 768px) and (orientation: portrait) {
    html, body {
      overflow: auto;
      height: auto;
    }

    #main-wrapper {
      height: auto;
    }

    #container {
      flex-direction: column;
      height: auto;
    }

    #left {
      width: 100%;
      padding: 30px 10px;
      box-sizing: border-box;
    }

    #right {
      width: 100%;
      padding: 20px 10px 30px 10px;
      box-sizing: border-box;
    }

    .grechina {
      font-size: 4vw;
    }

    #leftmenu a {
      font-size: 4.5vw;
      margin: 0 8px;
    }

    #clock {
      font-size: 9vw;
    }

    #count1 {
      font-size: 6vw;
    }

    #count2 {
      font-size: 4.5vw;
    }

    #right img {
      max-width: 85%;
      max-height: 65vh;
    }
  }
</style>
</head>

<body>

<div id="main-wrapper">
  <!-- GRECHINA INIZIO -->
  <div class="grechina">🎄 🎁 🎄 🎁 🎄 🎁 🎄 🎁 🎄 🎁 🎄 🎁 🎄</div>

  <div id="container">
    <!-- SINISTRA (Parte SOPRA in verticale) -->
    <div id="left">
      <div id="leftmenu">
        <a href="storia.html">Storia</a>
        <a href="episodi.html">Episodi</a>
        <a href="special.html">Special</a>
        <a href="slideshow.html">Slideshow</a>
      </div>

      <div id="clock">00:00:00</div>
      <div id="count1">🎄 Meno 000</div>
      <div id="count2">Giorni a Natale</div>
    </div>

    <!-- DESTRA (Parte SOTTO in verticale) -->
    <div id="right">
      <img id="fotoPinguino" src="" alt="Pinguino del mese">
    </div>
  </div>

  <!-- GRECHINA FINE -->
  <div class="grechina">🎄 🎁 🎄 🎁 🎄 🎁 🎄 🎁 🎄 🎁 🎄 🎁 🎄</div>
</div>

<script>
/* OROLOGIO */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  const s = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("clock").textContent = `${h}:${m}:${s}`;
}

/* COUNTDOWN */
function updateCountdown() {
  const today = new Date();
  const christmas = new Date(today.getFullYear(), 11, 25);
  const diff = Math.ceil((christmas - today) / (1000 * 60 * 60 * 24));

  document.getElementById("count1").textContent = `🎄 Meno ${diff}`;
  document.getElementById("count2").textContent = `Giorni a Natale`;
}

/* FOTO ASSOCIATA AL MESE / PERIODO */
function caricaFotoDelMese() {
  const now = new Date();
  const mese = now.getMonth(); 
  const giorno = now.getDate();

  let numeroFoto = 0;

  if (mese === 11 && giorno >= 24) {
    numeroFoto = 32;
  } else {
    numeroFoto = Math.floor((mese / 11) * 31); 
  }

  const url = `foto/pinguino${numeroFoto}.png`;
  document.getElementById("fotoPinguino").src = url;
}

setInterval(updateClock, 1000);
updateClock();
updateCountdown();
setInterval(updateCountdown, 1000 * 60 * 60);

caricaFotoDelMese();
</script>

</body>
</html>
