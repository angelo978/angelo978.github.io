<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>La Storia del Pinguino di Natale - Avventura Natalizia</title>
<meta name="description" content="Segui l'avventura del pinguino brontolone che deve recuperare la soletta magica per salvare il Natale. Una storia divertente con 35 scene animate.">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #0f0;
    font-family: monospace;
    overflow: hidden;
  }

  #container {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* SINISTRA */
  #left {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* MENU SINISTRA */
  #leftmenu {
    margin-bottom: 4vh;
    text-align: center;
  }

  #leftmenu a {
    color: #0f0;
    text-decoration: none;
    margin: 0 10px;
    font-size: 2vw;
    text-shadow: 0 0 10px #0f0;
  }

  #clock {
    font-size: 4vw;
    text-shadow: 0 0 20px #0f0;
    margin-bottom: 2vh;
  }

  #countdown {
    font-size: 2vw;
    text-shadow: 0 0 10px #0f0;
    white-space: nowrap;
  }

  /* DESTRA */
  #right {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #right img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    border: 2px solid #0f0;
    box-shadow: 0 0 20px #0f0;
    transition: opacity 0.5s ease-in-out;
  }

  /* MAGIA PER SMARTPHONE IN VERTICALE: TUTTO IN UNA SCHERMATA SENZA SCROLL */
  @media (max-width: 768px) and (orientation: portrait) {
    html, body {
      overflow: hidden;
      height: 100vh;
    }

    #container {
      flex-direction: column;
      height: 100vh;
    }

    #left {
      width: 100%;
      height: 35vh;
      padding: 1vh 2vw;
      box-sizing: border-box;
      justify-content: space-evenly;
    }

    #right {
      width: 100%;
      height: 65vh;
      padding: 1vh 5vw 2vh 5vw;
      box-sizing: border-box;
    }

    #leftmenu {
      margin-bottom: 0;
    }

    #leftmenu a {
      font-size: 3.8vw;
      margin: 0 5px;
    }

    #clock {
      font-size: 8vw;
      margin-bottom: 0;
    }

    #countdown {
      font-size: 3.6vw;
      white-space: nowrap;
    }

    #right img {
      max-width: 95%;
      max-height: 60vh;
    }
  }
</style>
</head>

<body>

<div id="container">

  <!-- SINISTRA (Parte SOPRA in verticale) -->
  <div id="left">
    <div id="leftmenu">
      <a href="storia.html">Storia</a>
      <a href="episodi.html">Episodi</a>
      <a href="special.html">Special</a>
      <a href="slideshow.html">Slideshow</a>
    </div>

    <div id="clock">00:00:00</div>
    <div id="countdown">🎄 Meno 000 Giorni a Natale</div>
  </div>

  <!-- DESTRA (Parte SOTTO in verticale) -->
  <div id="right">
    <img id="fotoPinguino" src="" alt="Pinguino del mese">
  </div>

</div>

<script>
/* OROLOGIO */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  const s = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("clock").textContent = `${h}:${m}:${s}`;
}

/* COUNTDOWN */
function updateCountdown() {
  const today = new Date();
  const christmas = new Date(today.getFullYear(), 11, 25);
  const diff = Math.ceil((christmas - today) / (1000 * 60 * 60 * 24));

  document.getElementById("countdown").textContent = `🎄 Meno ${diff} Giorni a Natale`;
}

/* FOTO ASSOCIATA AL MESE / PERIODI */
function caricaFotoDelMese() {
  const now = new Date();
  const mese = now.getMonth(); 
  const giorno = now.getDate();

  let numeroFoto = 0;

  if (mese === 11 && giorno >= 24) {
    numeroFoto = 32;
  } else {
    numeroFoto = Math.floor((mese / 11) * 31); 
  }

  const url = `foto/pinguino${numeroFoto}.png`;
  document.getElementById("fotoPinguino").src = url;
}

setInterval(updateClock, 1000);
updateClock();
updateCountdown();
setInterval(updateCountdown, 1000 * 60 * 60);

caricaFotoDelMese();
</script>

</body>
</html>
