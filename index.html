<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Angelo978 – Orologio e Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #0f0;
    font-family: monospace;
    overflow: hidden;
  }

  #container {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* SINISTRA */
  #left {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* MENU SINISTRA */
  #leftmenu {
    margin-bottom: 50px;
    text-align: center;
  }

  #leftmenu a {
    color: #0f0;
    text-decoration: none;
    margin: 0 10px;
    font-size: 2vw;
    text-shadow: 0 0 10px #0f0;
  }

  #clock {
    font-size: 4vw;
    text-shadow: 0 0 20px #0f0;
    margin-bottom: 20px;
  }

  #count1 {
    font-size: 2.5vw;
    text-shadow: 0 0 10px #0f0;
  }

  #count2 {
    font-size: 2vw;
    text-shadow: 0 0 10px #0f0;
    margin-top: 5px;
  }

  /* DESTRA */
  #right {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #right img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    border: 2px solid #0f0;
    box-shadow: 0 0 20px #0f0;
    transition: opacity 0.5s ease-in-out;
  }

  /* SMARTPHONE IN VERTICALE: SCRITTE SOPRA, FOTO SOTTO */
  @media (max-width: 768px) and (orientation: portrait) {
    body {
      overflow: auto;
    }

    #container {
      flex-direction: column;
      height: auto;
      min-height: 100%;
    }

    #left {
      width: 100%;
      padding: 30px 10px;
      box-sizing: border-box;
    }

    #right {
      width: 100%;
      padding: 20px 10px 40px 10px;
      box-sizing: border-box;
    }

    #leftmenu a {
      font-size: 4.5vw;
      margin: 0 8px;
    }

    #clock {
      font-size: 9vw;
    }

    #count1 {
      font-size: 6vw;
    }

    #count2 {
      font-size: 4.5vw;
    }

    #right img {
      max-width: 85%;
      max-height: 70vh;
    }
  }
</style>
</head>

<body>

<div id="container">

  <!-- SINISTRA (Parte SOPRA in verticale) -->
  <div id="left">

    <div id="leftmenu">
      <a href="storia.html">Storia</a>
      <a href="episodi.html">Episodi</a>
      <a href="special.html">Special</a>
      <a href="slideshow.html">Slideshow</a>
    </div>

    <div id="clock">00:00:00</div>
    <div id="count1">🎄 Meno 000</div>
    <div id="count2">Giorni a Natale</div>
  </div>

  <!-- DESTRA (Parte SOTTO in verticale) -->
  <div id="right">
    <img id="fotoPinguino" src="" alt="Pinguino del giorno">
  </div>

</div>

<script>
/* OROLOGIO */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  const s = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("clock").textContent = `${h}:${m}:${s}`;
}

/* COUNTDOWN */
function updateCountdown() {
  const today = new Date();
  const christmas = new Date(today.getFullYear(), 11, 25);
  const diff = Math.ceil((christmas - today) / (1000 * 60 * 60 * 24));

  document.getElementById("count1").textContent = `🎄 Meno ${diff}`;
  document.getElementById("count2").textContent = `Giorni a Natale`;
}

/* GESTIONE FOTO CALENDARIZZATA (Gennaio -> Foto 0 | Agosto -> Foto 16 | Natale -> Foto 32) */
function calcolaFotoDelPeriodo() {
  const now = new Date();
  const mese = now.getMonth(); // 0 = Gennaio, 7 = Agosto, 11 = Dicembre
  const giorno = now.getDate();

  let fotoSelezionata = 0;

  // Se siamo a dicembre vicino a Natale (dal 20 in poi), puntiamo dritti alla 32
  if (mese === 11 && giorno >= 20) {
    fotoSelezionata = 32;
  } else {
    // Mappatura lineare dei mesi dell'anno (da Gennaio a Dicembre) sulle 32 scene
    // Gennaio (0) -> circa foto 0-2
    // Agosto (7) -> circa foto 16
    // Dicembre prima del 20 -> foto vicine alla 31
    const giornoDellAnno = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
    // Dividiamo i giorni dell'anno (365) in 32 step per far avanzare la foto pian piano
    let step = Math.floor(giornoDellAnno / (365 / 32));
    fotoSelezionata = Math.min(Math.max(step, 0), 31); // Massimo 31 prima del blocco di Natale
  }

  const url = `foto/pinguino${fotoSelezionata}.png`;
  
  // Verifica se l'immagine esiste, altrimenti scala sulla prima disponibile
  const imgTest = new Image();
  imgTest.src = url;
  imgTest.onload = () => {
    document.getElementById("fotoPinguino").src = url;
  };
  imgTest.onerror = () => {
    // Fallback sulla foto 0 se quella calcolata non è ancora caricata nella cartella
    document.getElementById("fotoPinguino").src = `foto/pinguino0.png`;
  };
}

setInterval(updateClock, 1000);
updateClock();
updateCountdown();
setInterval(updateCountdown, 1000 * 60 * 60);

// Carica la foto giusta in base al periodo dell'anno
calcolaFotoDelPeriodo();
</script>

</body>
</html>
