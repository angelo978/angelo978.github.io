<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Slideshow Pinguino</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    height: 100%; 
    background: #000; 
    color: #0f0; 
    font-family: monospace; 
    overflow: hidden; 
  }

  #container { 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    width: 100%; 
    justify-content: space-between; 
    align-items: center; 
    box-sizing: border-box;
    padding: 1vh 10px;
  }

  #title { 
    font-size: 2vw; 
    text-shadow: 0 0 10px #0f0; 
    text-align: center;
    margin-top: 1vh;
  }
  
  /* Area immagine centrale con frecce laterali */
  .display-area { 
    display: flex; 
    align-items: center; 
    justify-content: center;
    height: 62vh; 
    width: 100%;
    position: relative;
    gap: 15px;
  }

  #fotoPinguino { 
    max-width: 75vw; 
    max-height: 100%; 
    object-fit: contain; 
    border: 2px solid #0f0; 
    box-shadow: 0 0 20px #0f0; 
    cursor: pointer;
  }

  /* Frecce triangolari ai fianchi */
  .side-btn {
    background: none;
    border: none;
    color: #0f0;
    font-size: 4vw;
    cursor: pointer;
    text-shadow: 0 0 15px #0f0;
    font-family: monospace;
    padding: 10px;
    user-select: none;
    transition: transform 0.1s;
  }

  .side-btn:active {
    transform: scale(0.9);
  }

  #status { 
    font-size: 1.8vw; 
    text-shadow: 0 0 10px #0f0; 
    text-align: center;
  }

  .home-link { 
    color: #0f0; 
    text-decoration: none; 
    font-size: 1.5vw; 
    text-shadow: 0 0 10px #0f0; 
    margin-bottom: 1vh;
  }
  
  .home-link:hover {
    text-decoration: underline;
  }

  /* OTTIMIZZAZIONE PER SMARTPHONE IN VERTICALE */
  @media (max-width: 768px) and (orientation: portrait) {
    html, body {
      overflow: hidden;
      height: 100vh;
    }
    #container {
      height: 100vh;
      padding: 1vh 5px;
    }
    #title {
      font-size: 4.5vw;
      margin-top: 0.5vh;
    }
    .display-area {
      height: 68vh;
      gap: 10px;
    }
    #fotoPinguino {
      max-width: 70vw;
      max-height: 100%;
      border: 2px solid #0f0 !important;
      box-shadow: 0 0 15px #0f0 !important;
    }
    .side-btn {
      font-size: 8vw;
      padding: 5px;
    }
    #status {
      font-size: 3.8vw;
    }
    .home-link {
      font-size: 3.8vw;
      margin-bottom: 1vh;
    }
  }
</style>
</head>
<body>

<div id="container">
  <div id="title">🎞 Viaggio del Pinguino</div>
  
  <div class="display-area">
    <button class="side-btn" onclick="cambiaFoto(-1)">◀</button>
    <!-- Cliccando direttamente sull'immagine si va avanti -->
    <img id="fotoPinguino" src="" alt="FINE" onclick="cambiaFoto(1)" title="Clicca per la foto successiva">
    <button class="side-btn" onclick="cambiaFoto(1)">▶</button>
  </div>

  <div id="status"></div>
  <a class="home-link" href="index.html">&larr; Torna alla Home</a>
</div>

<script>
  let index = 0;
  
  const listaFoto = [
    "foto/pinguino0.png",
    "foto/pinguino1.png",
    "foto/pinguino2.png",
    "foto/pinguino3.png",
    "foto/pinguino4.png",
    "foto/pinguino4s.png",
    "foto/pinguino5.png",
    "foto/pinguino6.png",
    "foto/pinguino7.png",
    "foto/pinguino8.png",
    "foto/pinguino9.png",
    "foto/pinguino10.png",
    "foto/pinguino11.png",
    "foto/pinguino12.png",
    "foto/pinguino13.png",
    "foto/pinguino14.png",
    "foto/pinguino15.png",
    "foto/pinguino16.png",
    "foto/pinguino17.png",
    "foto/pinguino18.png",
    "foto/pinguino19.png",
    "foto/pinguino20.png",
    "foto/pinguino21.png",
    "foto/pinguino22.png",
    "foto/pinguino23.png",
    "foto/pinguino24.png",
    "foto/pinguino24a.png",
    "foto/pinguino25.png",
    "foto/pinguino26.png",
    "foto/pinguino27.png",
    "foto/pinguino28.png",
    "foto/pinguino29.png",
    "foto/pinguino30.png",
    "foto/pinguino31.png",
    "foto/pinguino32.png"
  ];

  const fileSpeciali = [
    "foto/pinguino0.png",
    "foto/pinguino4s.png",
    "foto/pinguino24a.png"
  ];

  function mostraFoto() {
    const imgElement = document.getElementById("fotoPinguino");
    const statusElement = document.getElementById("status");
    const currentFile = listaFoto[index];

    imgElement.src = currentFile;
    imgElement.style.display = "block";

    if (fileSpeciali.includes(currentFile)) {
      statusElement.innerText = `⭐ Scena Speciale`;
    } else {
      const totaleNormali = listaFoto.length - fileSpeciali.length;
      let numeroCorrente = 0;
      for (let i = 0; i <= index; i++) {
        if (!fileSpeciali.includes(listaFoto[i])) {
          numeroCorrente++;
        }
      }
      statusElement.innerText = `Foto ${numeroCorrente} di ${totaleNormali}`;
    }
  }

  function cambiaFoto(direzione) {
    index += direzione;
    if (index >= listaFoto.length) {
      index = 0;
    }
    if (index < 0) {
      index = listaFoto.length - 1;
    }
    mostraFoto();
  }

  mostraFoto();
</script>

</body>
</html>
