<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Slideshow Pinguino</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    height: 100%; 
    background: #000; 
    color: #0f0; 
    font-family: monospace; 
    overflow: hidden; 
  }

  #container { 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    width: 100%; 
    justify-content: center; 
    align-items: center; 
    box-sizing: border-box;
    padding: 10px;
  }

  #title { 
    margin-bottom: 15px; 
    font-size: 2vw; 
    text-shadow: 0 0 10px #0f0; 
    text-align: center;
  }
  
  /* Area immagine */
  .display-area { 
    display: flex; 
    align-items: center; 
    justify-content: center;
    height: 65vh; 
    width: 100%;
    position: relative;
  }

  #fotoPinguino { 
    max-width: 80vw; 
    max-height: 100%; 
    object-fit: contain; 
    border: 2px solid #0f0; 
    box-shadow: 0 0 20px #0f0; 
    cursor: pointer;
  }
  
  /* Controlli touch / testuali puliti sotto o ai lati */
  .nav-bar {
    display: flex;
    gap: 30px;
    margin-top: 15px;
  }

  .nav-btn { 
    color: #0f0; 
    background: none;
    border: none;
    font-size: 1.8vw; 
    cursor: pointer; 
    text-shadow: 0 0 10px #0f0; 
    font-family: monospace;
    font-weight: bold;
  }
  
  .nav-btn:hover { 
    text-decoration: underline;
  }

  #status { 
    margin-top: 10px; 
    font-size: 1.8vw; 
    text-shadow: 0 0 10px #0f0; 
    min-height: 2vw; 
    text-align: center;
  }

  .home-link { 
    color: #0f0; 
    margin-top: 15px; 
    text-decoration: none; 
    font-size: 1.5vw; 
    text-shadow: 0 0 10px #0f0; 
  }
  
  .home-link:hover {
    text-decoration: underline;
  }

  /* OTTIMIZZAZIONE PER SMARTPHONE IN VERTICALE */
  @media (max-width: 768px) {
    body {
      overflow: auto;
    }
    #container {
      height: auto;
      min-height: 100%;
      padding: 20px 10px;
    }
    #title {
      font-size: 5vw;
    }
    .display-area {
      height: auto;
    }
    #fotoPinguino {
      max-width: 90vw;
      max-height: 55vh;
    }
    .nav-btn {
      font-size: 5vw;
    }
    #status {
      font-size: 4.5vw;
    }
    .home-link {
      font-size: 4.5vw;
      margin-top: 25px;
    }
  }
</style>
</head>
<body>

<div id="container">
  <div id="title">🎞 Viaggio del Pinguino</div>
  
  <div class="display-area">
    <!-- Cliccando direttamente sull'immagine si va avanti -->
    <img id="fotoPinguino" src="" alt="FINE" onclick="cambiaFoto(1)" title="Clicca per la foto successiva">
  </div>

  <div class="nav-bar">
    <button class="nav-btn" onclick="cambiaFoto(-1)">&larr; Indietro</button>
    <button class="nav-btn" onclick="cambiaFoto(1)">Avanti &rarr;</button>
  </div>

  <div id="status"></div>
  <a class="home-link" href="index.html">&larr; Torna alla Home</a>
</div>

<script>
  let index = 0;
  
  const listaFoto = [
    "foto/pinguino0.png",
    "foto/pinguino1.png",
    "foto/pinguino2.png",
    "foto/pinguino3.png",
    "foto/pinguino4.png",
    "foto/pinguino4s.png",
    "foto/pinguino5.png",
    "foto/pinguino6.png",
    "foto/pinguino7.png",
    "foto/pinguino8.png",
    "foto/pinguino9.png",
    "foto/pinguino10.png",
    "foto/pinguino11.png",
    "foto/pinguino12.png",
    "foto/pinguino13.png",
    "foto/pinguino14.png",
    "foto/pinguino15.png",
    "foto/pinguino16.png",
    "foto/pinguino17.png",
    "foto/pinguino18.png",
    "foto/pinguino19.png",
    "foto/pinguino20.png",
    "foto/pinguino21.png",
    "foto/pinguino22.png",
    "foto/pinguino23.png",
    "foto/pinguino24.png",
    "foto/pinguino24a.png",
    "foto/pinguino25.png",
    "foto/pinguino26.png",
    "foto/pinguino27.png",
    "foto/pinguino28.png",
    "foto/pinguino29.png",
    "foto/pinguino30.png",
    "foto/pinguino31.png",
    "foto/pinguino32.png"
  ];

  const fileSpeciali = [
    "foto/pinguino0.png",
    "foto/pinguino4s.png",
    "foto/pinguino24a.png"
  ];

  function mostraFoto() {
    const imgElement = document.getElementById("fotoPinguino");
    const statusElement = document.getElementById("status");
    const currentFile = listaFoto[index];

    imgElement.src = currentFile;
    imgElement.style.display = "block";

    if (fileSpeciali.includes(currentFile)) {
      statusElement.innerText = `⭐ Scena Speciale`;
    } else {
      const totaleNormali = listaFoto.length - fileSpeciali.length;
      let numeroCorrente = 0;
      for (let i = 0; i <= index; i++) {
        if (!fileSpeciali.includes(listaFoto[i])) {
          numeroCorrente++;
        }
      }
      statusElement.innerText = `Foto ${numeroCorrente} di ${totaleNormali}`;
    }
  }

  function cambiaFoto(direzione) {
    index += direzione;
    if (index >= listaFoto.length) {
      index = 0;
    }
    if (index < 0) {
      index = listaFoto.length - 1;
    }
    mostraFoto();
  }

  mostraFoto();
</script>

</body>
</html>
